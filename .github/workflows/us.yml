# =============================================================
#  미국 주식·지수·환율을 매일 수집합니다.
# =============================================================
#  준비물은 DATABASE_URL 하나뿐입니다. 야후 파이낸스는 열쇠(API key)가
#  없어도 쓸 수 있습니다. 대신 공식 창구가 아니라서 한꺼번에 많이 부르면
#  막힙니다. 그래서 수집기가 스스로 쉬어가며 받습니다.
#
#  ★ 처음 한 번 ★
#    [Run workflow] 를 누르고 days 에 365 를 넣어 1년치를 채웁니다.
#    한 번 채우고 나면 매일 자동으로 최근 며칠만 덧대므로 금방 끝납니다.
#
#  ★ 왜 이 시각인가 ★
#    미국 장은 한국시간으로 새벽에 끝납니다(서머타임 때 05:00,
#    아닐 때 06:00). 그날 종가가 확실히 확정된 뒤인 한국시간 오후 4시에
#    돌립니다. 늦게 받아서 손해 볼 것은 없고, 일찍 받으면 빈 값이 옵니다.
# =============================================================

name: 미국 시세 수집

on:
  schedule:
    # 07:00 UTC = 16:00 KST. 미국 장이 끝난 뒤(월~금 장 → 화~토)입니다.
    - cron: "0 7 * * 2-6"

  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 받을지 (처음 채울 때는 365)"
        required: false
        default: "7"
      skip_profile:
        description: "회사 정보(느림)를 건너뛰려면 yes"
        required: false
        default: "no"

concurrency:
  group: us-collect
  cancel-in-progress: false

jobs:
  collect:
    name: 미국 시세 수집
    runs-on: ubuntu-latest
    # 1년치 + 회사 정보 100종목을 넉넉히 받을 수 있는 시간입니다.
    timeout-minutes: 90

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 표가 준비돼 있는지 확인
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.create_tables

      - name: 미국 시세·지수·환율 수집
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Seoul
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=7; fi
          if [ "${{ github.event.inputs.skip_profile }}" = "yes" ]; then
            python -m src.us_collect --days "$DAYS" --skip-profile
          else
            python -m src.us_collect --days "$DAYS"
          fi

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::미국 시세 수집이 실패했습니다."
          echo "야후는 공식 창구가 아니라서 가끔 막힙니다(429). 그럴 때는"
          echo "잠시 뒤 [Run workflow] 로 다시 돌리면 대개 됩니다."
          echo "빠진 날짜는 다음 실행 때 저절로 채워집니다."
