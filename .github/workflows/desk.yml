# =============================================================
#  여섯 부서 — 증권사처럼 나눠서 종목을 봅니다
# =============================================================
#  준비물: DATABASE_URL, ANTHROPIC_API_KEY
#
#  ★ 돈이 듭니다 ★
#    한 종목에 Claude 를 다섯 번 부릅니다.
#      02 기술적분석부 · 03 펀더멘탈부 · 04 마켓부  → 빠른 모델
#      05 리스크관리부 · 06 운용부                  → 판단 모델
#    01 스크리닝부는 SQL 이라 부르지 않습니다.
#
#    top 을 크게 잡기 전에 dry_run 으로 몇 번 부르게 되는지 보세요.
#
#  ★ 저절로 돌지 않습니다 ★
#    일부러 schedule 을 두지 않았습니다. 돈이 드는 일은 누를 때만
#    도는 편이 낫습니다. 쓸 만하다 싶으면 그때 schedule 을 답니다.
# =============================================================

name: 여섯 부서

on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목코드 하나만 볼 때 (비우면 스크리닝 결과)"
        required: false
        default: ""
      top:
        description: "스크리닝 상위 몇 종목"
        required: false
        default: "3"
      min_value:
        description: "최소 하루 거래대금(억). 팔 수 있어야 후보입니다"
        required: false
        default: "10"
      dry_run:
        description: "Claude 를 부르지 않고 준비만 보려면 yes"
        required: false
        default: "no"

concurrency:
  group: desk-run
  cancel-in-progress: false

jobs:
  run:
    name: 여섯 부서
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 표가 준비돼 있는지 확인
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.create_tables

      - name: 부서 돌리기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: Asia/Seoul
        run: |
          ARGS="--top ${{ github.event.inputs.top }}"
          if [ -n "${{ github.event.inputs.code }}" ]; then
            ARGS="--code ${{ github.event.inputs.code }}"
          fi
          if [ -n "${{ github.event.inputs.min_value }}" ]; then
            ARGS="$ARGS --min-value ${{ github.event.inputs.min_value }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "yes" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "실행: python -m src.desk_run $ARGS"
          python -m src.desk_run $ARGS

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::부서 돌리기가 실패했습니다."
          echo "ANTHROPIC_API_KEY 가 Secrets 에 있는지 확인하세요."
          echo "열쇠는 console.anthropic.com 에서 만듭니다."
