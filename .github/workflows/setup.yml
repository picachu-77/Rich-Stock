# =============================================================
#  표(테이블)를 자동으로 만듭니다.
# =============================================================
#  왜 이 파일이 있나요?
#    새 기능을 넣으면 데이터베이스에 새 표가 필요할 때가 있습니다.
#    (모의투자 → paper_trade · paper_cash, 방향 → disclosure)
#    예전에는 그때마다 사람이 명령창에서
#        python -m src.create_tables
#    를 직접 쳐야 했습니다. 화면은 깃허브에 올리면 알아서 새로 배포되는데
#    표만 손으로 만들어야 해서, 배포 뒤에 화면이 열리지 않는 일이
#    생겼습니다.
#
#    이제 src/create_tables.py 가 바뀐 채로 올라오면 이 작업이 저절로
#    돌아서 없는 표를 만들어 둡니다. 손으로 할 일이 없어집니다.
#
#  여러 번 돌아도 안전한가요?
#    네. 모든 문장이 CREATE TABLE IF NOT EXISTS 라서, 이미 있는 표는
#    건드리지 않고 넘어갑니다. 들어 있던 자료도 그대로 있습니다.
#
#  준비물 (이미 등록해 두셨습니다)
#    Settings > Secrets and variables > Actions 의 DATABASE_URL
# =============================================================

name: 표 만들기 (자동)

on:
  push:
    branches: [main]
    paths:
      # 표 설계가 바뀐 경우에만 돌립니다. 화면만 고쳤을 때는 돌지 않습니다.
      - "src/create_tables.py"
      - ".github/workflows/setup.yml"

  # 깃허브 화면의 [Run workflow] 버튼으로 아무 때나 직접 돌릴 수도 있습니다.
  workflow_dispatch:

# 두 번이 겹쳐 돌지 않게 막습니다.
concurrency:
  group: create-tables
  cancel-in-progress: false

jobs:
  create-tables:
    name: 없는 표 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # 표를 만드는 데는 데이터베이스 연결에 필요한 두 가지면 충분합니다.
      # 시세·차트용 부품(pykrx·pandas·streamlit·plotly)까지 다 받으면
      # 쓰지도 않을 것을 1분 넘게 내려받게 됩니다.
      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: 표 만들기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Seoul
        run: python -m src.create_tables

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::표를 만들지 못했습니다."
          echo "확인할 점:"
          echo " 1) Settings > Secrets 에 DATABASE_URL 이 등록되어 있는지"
          echo " 2) Neon 프로젝트가 살아 있는지 (무료 플랜은 오래 안 쓰면 잠듭니다)"
          echo " 3) Neon 무료 용량(512MB)이 꽉 차지는 않았는지"
