# =============================================================
#  분기마다 DART 재무지표를 자동으로 수집합니다.
# =============================================================
#  ★ 실행 전 준비 (깃허브 웹사이트에서 한 번만) ★
#    저장소 > Settings > Secrets and variables > Actions >
#    [New repository secret] 로 아래를 등록하세요.
#
#      이름(Name)        값(Secret)
#      ---------------   ------------------------------------
#      DATABASE_URL      Neon 연결 문자열  (이미 등록하셨습니다)
#      DART_API_KEY      DART 오픈API 40자리 인증키  ← 새로 필요
#
#    ※ KRX_ID / KRX_PW 는 여기서 쓰지 않습니다.
#      재무지표는 거래소가 아니라 DART 에서 받기 때문입니다.
#
#  ★ 왜 분기마다인가 ★
#    재무제표는 3개월에 한 번만 새로 나옵니다.
#    매일 받아봐야 같은 값이라 의미가 없고 DART 호출만 낭비됩니다.
# =============================================================

name: 분기별 재무지표 수집

on:
  schedule:
    # 공시 마감 직후를 노려 2·5·8·11월 15일 새벽 3시(한국시간)에 실행합니다.
    #   1분기  → 5월 중순 마감
    #   반기    → 8월 중순 마감
    #   3분기  → 11월 중순 마감
    #   사업보고서 → 이듬해 3월 말 마감
    # cron 은 세계표준시(UTC)라 한국시간 03:00 = 전날 18:00 UTC
    - cron: "0 18 14 2,5,8,11 *"

  # 깃허브 화면에서 직접 돌릴 수도 있게 합니다.
  workflow_dispatch:
    inputs:
      mode:
        description: "수집 범위"
        required: true
        default: "latest"
        type: choice
        options:
          - latest      # 가장 최근 분기 하나만 (평소 자동 실행)
          - years3      # 최근 3년치 전체 (처음 채울 때)
      with_dividend:
        description: "배당성향도 수집 (느림: 호출 약 8,000건)"
        required: false
        default: false
        type: boolean
      redo:
        description: "이미 받은 분기도 다시 받기 (평소엔 끕니다)"
        required: false
        default: false
        type: boolean
      refresh_profile:
        description: "회사 업종·대표이사 정보를 전부 다시 받기 (호출 약 2,600건)"
        required: false
        default: false
        type: boolean

concurrency:
  group: quarterly-financial
  cancel-in-progress: false

jobs:
  collect:
    name: 재무지표 수집
    runs-on: ubuntu-latest
    # 3년치는 분기가 12개고, 재보니 두 시간에 4분기쯤 갑니다.
    # 120분으로는 한 번에 못 끝내서 여러 번 눌러야 했습니다.
    # 이제 받은 분기를 건너뛰므로 여러 번 눌러도 되지만, 휴대폰으로
    # 쓰시는 분께 몇 번씩 누르게 하는 건 좋지 않습니다.
    # 깃허브가 허용하는 최대치(6시간)에 조금 못 미치게 잡아, 한 번에
    # 끝나도록 합니다. 최근 분기 하나만 받는 평소 실행은 몇 분이면
    # 끝나므로 이 값이 커도 낭비가 아닙니다.
    timeout-minutes: 350

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 표에 새로 생긴 칸(업종·대표이사 등)을 만들어 둡니다.
      # 이미 있으면 아무 일도 하지 않으므로 몇 번을 실행해도 안전합니다.
      - name: 표 구조 갱신
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.create_tables

      # 신규 상장 회사가 생겼을 수 있으니 회사코드 대응표를 먼저 갱신합니다.
      # (DART 호출 1건이면 끝납니다)
      - name: DART 회사코드 대응표 갱신
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m src.dart_corpcode

      - name: 재무지표 수집
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          MODE="${{ github.event.inputs.mode }}"
          DIV_FLAG="--skip-dividend"
          if [ "${{ github.event.inputs.with_dividend }}" = "true" ]; then
            DIV_FLAG=""
          fi

          REDO_FLAG=""
          if [ "${{ github.event.inputs.redo }}" = "true" ]; then
            REDO_FLAG="--redo"
          fi

          # 3년치는 분기가 12개라 두 시간 안에 못 끝납니다(실제로 120분
          # 제한에 걸려 끊겼습니다). 이제 받은 분기를 건너뛰므로,
          # 끊기면 이 버튼을 다시 누르면 남은 분기부터 이어갑니다.
          if [ "$MODE" = "years3" ]; then
            python -m src.financial_collect --years 3 $DIV_FLAG $REDO_FLAG
          else
            python -m src.financial_collect --latest $DIV_FLAG $REDO_FLAG
          fi

      # 회사 업종·대표이사·설립일을 받아옵니다.
      # (우량주 찾기 화면에서 '같은 업종끼리 비교'에 씁니다)
      #
      # ★ 순서와 continue-on-error 에 대해 ★
      #   이 작업은 회사가 많으면 30분 넘게 걸립니다. 그래서
      #   (1) 더 중요한 재무지표를 먼저 받고 나서 실행하고,
      #   (2) 여기서 실패하더라도 앞 단계 결과는 그대로 남도록
      #       continue-on-error 로 두었습니다.
      #   중간중간 저장하므로 실패해도 받은 데까지는 남고,
      #   다음에 다시 실행하면 못 받은 곳부터 이어서 받습니다.
      - name: 회사 기본정보(업종·대표이사) 수집
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.refresh_profile }}" = "true" ]; then
            python -m src.company_profile --all
          else
            python -m src.company_profile
          fi

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::재무지표 수집에 실패했습니다."
          echo "확인할 점:"
          echo " 1) Settings > Secrets 에 DART_API_KEY 가 등록되어 있는지"
          echo " 2) DART 하루 호출 한도(20,000건)를 넘지 않았는지"
          echo " 3) Neon 프로젝트가 살아 있는지"
          echo ""
          echo "참고: 이 작업이 실패해도 매일 시세 수집과 화면은 정상 동작합니다."
