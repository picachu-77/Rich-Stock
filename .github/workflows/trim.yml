# =============================================================
#  창고 자리 만들기
# =============================================================
#  ★ 기본은 '살펴보기' 입니다 ★
#    그냥 실행하면 무엇이 얼마나 사라지는지 숫자만 보여주고
#    아무것도 지우지 않습니다. 숫자를 확인하신 뒤에
#    apply 를 yes 로 바꿔서 한 번 더 실행하세요.
#
#  ★ 무엇을 하나요 ★
#    최근 180일 시세는 매일 그대로 두고, 그보다 오래된 것은
#    주 1회(그 주의 마지막 거래일)만 남깁니다.
#    기간은 줄지 않습니다 — 3년 그래프도 3년 수익률도 그대로입니다.
#
#  ★ 되돌릴 수 있나요 ★
#    지운 시세는 되돌릴 수 없습니다. 다만 한국 시세는
#    '과거 시세 채우기' 로 거래소에서 다시 받을 수 있습니다.
# =============================================================

name: 창고 자리 만들기

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 정리하려면 yes (기본은 숫자만 보기)"
        required: false
        default: "no"
      days:
        description: "최근 며칠을 매일 그대로 둘지"
        required: false
        default: "180"
      with_regular:
        description: "정기보고서 공시도 정리하려면 yes"
        required: false
        default: "no"

concurrency:
  group: trim
  cancel-in-progress: false

jobs:
  trim:
    name: 창고 자리 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품 설치
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Seoul
        run: |
          ARGS="--days ${{ github.event.inputs.days }}"
          if [ "${{ github.event.inputs.apply }}" = "yes" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ github.event.inputs.with_regular }}" = "yes" ]; then ARGS="$ARGS --with-regular"; fi
          echo "실행: python -m src.trim $ARGS"
          python -m src.trim $ARGS
