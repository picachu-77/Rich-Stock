# =============================================================
#  배당 — "언제까지 사야 받나" 를 채웁니다
# =============================================================
#  준비물: DATABASE_URL, DART_API_KEY
#
#  ★ 공시 목록을 다시 받지 않습니다 ★
#    배당 공시는 이미 disclosure 표에 들어 있습니다(공시 수집기가
#    코스피·코스닥 전체를 날짜로 받아둡니다). 여기서는 제목에 '배당'
#    이 든 것만 골라 **원문만** 받습니다. 공시 한 건당 DART 호출
#    한 번입니다.
#
#  ★ 한 번 읽은 공시는 다시 안 받습니다 ★
#    공시 원문은 바뀌지 않습니다. 이미 dividend 표에 있는 접수번호는
#    건너뜁니다.
#
#  ★ 처음 한 번 ★
#    [Run workflow] 에서 days 에 1200 을 넣어 3년치를 채웁니다.
# =============================================================

name: 배당 수집

on:
  schedule:
    # 22:00 UTC = 07:00 KST. 공시 수집(disclosure)이 끝난 뒤입니다.
    # 배당 공시는 하루에 몇 건 안 나와서 하루 한 번이면 충분합니다.
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지의 공시를 볼지 (처음 채울 때는 1200)"
        required: false
        default: "400"
      dry_run:
        description: "저장하지 않고 보기만 하려면 yes"
        required: false
        default: "no"

concurrency:
  group: dividend-collect
  cancel-in-progress: false

jobs:
  collect:
    name: 배당 수집
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 표가 준비돼 있는지 확인
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.create_tables

      - name: 배당 공시 읽기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=400; fi
          ARGS="--days $DAYS"
          if [ "${{ github.event.inputs.dry_run }}" = "yes" ]; then ARGS="$ARGS --dry-run"; fi
          echo "실행: python -m src.dividend_collect $ARGS"
          python -m src.dividend_collect $ARGS
