# =============================================================
#  창고에 뭐가 얼마나 들어 있는지 봅니다. (아무것도 고치지 않습니다)
# =============================================================
#  ★ 왜 필요한가 ★
#    Supabase 무료 한도는 500MB 입니다. 시세는 거래일마다 4,000줄씩
#    쌓이고, 공시는 1년치가 13만 줄이 넘습니다. 언제 한도에 닿는지
#    모르면 어느 날 갑자기 저장이 실패하기 시작합니다.
#
#  ★ 어떻게 보나 ★
#    저장소 > Actions > 창고 현황 보기 > [Run workflow]
#    휴대폰 브라우저에서도 됩니다. 결과는 로그에 표로 찍힙니다.
#
#  ★ 안전합니다 ★
#    읽기만 합니다. 지우거나 고치는 것이 없습니다.
# =============================================================

name: 창고 현황 보기

on:
  workflow_dispatch:

concurrency:
  group: db-status
  cancel-in-progress: true

jobs:
  status:
    name: 창고 현황
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 창고를 들여다보기만 하므로 데이터베이스 부품 두 개면 충분합니다.
      # requirements.txt 를 전부 설치하면 1분 넘게 걸립니다.
      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: 현황 보기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Seoul
        run: python -m src.db_status
