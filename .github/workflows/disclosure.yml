# =============================================================
#  매일 DART 공시 목록을 자동으로 모읍니다.
# =============================================================
#  ★ 실행 전 준비 (깃허브 웹사이트에서 한 번만) ★
#    저장소 > Settings > Secrets and variables > Actions >
#    [New repository secret] 로 아래 두 개가 등록되어 있어야 합니다.
#
#      이름(Name)        값(Secret)
#      ---------------   ------------------------------------
#      DATABASE_URL      Neon 연결 문자열  (이미 등록하셨습니다)
#      DART_API_KEY      DART 오픈API 40자리 인증키
#
#  ★ 왜 매일인가 ★
#    공시는 매일 새로 나옵니다. 재무제표처럼 3개월에 한 번이 아니라,
#    "오늘 이 회사가 무엇을 결정했는지" 는 그날그날 올라옵니다.
#
#  ★ DART 한도를 얼마나 쓰나 ★
#    종목마다 따로 부르지 않고 '이 기간 공시 전부' 를 100건씩 받습니다.
#    하루치가 보통 1,000건 안팎이라 코스피·코스닥 합쳐 20~30번이면 끝납니다.
#    DART 하루 한도는 20,000건이므로 여유가 많습니다.
#
#  ★ 처음 한 번은 직접 돌려주세요 ★
#    아래 [Run workflow] 버튼으로 days 를 365 로 넣어 1년치를 채운 뒤에는
#    매일 자동으로 최근 것만 따라 붙습니다.
# =============================================================

name: 매일 공시 수집

on:
  schedule:
    # 한국시간 = UTC + 9시간  →  밤 11시 30분(23:30) KST = 14:30 UTC
    # 시세 수집(14:00 UTC)이 끝난 뒤에 돌도록 30분 뒤로 뒀습니다.
    - cron: "30 14 * * *"

  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 받을지 (처음 채울 때는 365)"
        required: false
        default: "7"

concurrency:
  group: disclosure-collect
  cancel-in-progress: false

jobs:
  collect:
    name: 공시 수집
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 공시는 '회사코드 대응표(dart_corp_code)' 가 있어야 받을 수 있습니다.
      # 이게 비어 있으면 수집기가 아무것도 못 하고 끝납니다. 예전에는 그래도
      # 작업이 초록불이라 '성공했는데 공시는 0건' 인 상태를 못 알아챘습니다.
      # 여기서 미리 채워두면 이 작업 하나만 눌러도 끝까지 됩니다.
      # (DART 호출 1건이면 끝나고, 신규 상장 회사도 함께 따라옵니다)
      - name: DART 회사코드 대응표 갱신
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -m src.dart_corpcode

      - name: 공시 수집 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python -m src.disclosure_collect --days "${{ github.event.inputs.days || 7 }}"

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::공시 수집에 실패했습니다."
          echo "확인할 점:"
          echo " 1) Settings > Secrets 에 DATABASE_URL, DART_API_KEY 가 등록되어 있는지"
          echo " 2) disclosure 표가 만들어져 있는지 (python -m src.create_tables)"
          echo " 3) ticker 표의 dart_corp_code 가 채워져 있는지 (python -m src.dart_corpcode)"
          echo " 4) Neon 프로젝트가 살아 있는지 (무료 플랜은 오래 안 쓰면 잠들 수 있습니다)"
