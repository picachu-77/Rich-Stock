# =============================================================
#  배당 기준일 정찰 — 어디서 받을 수 있는지 보기만 합니다
# =============================================================
#  아무것도 저장하지 않습니다. 창고에서 회사코드만 읽고, DART 에
#  몇 번 물어본 결과를 기록에 찍습니다.
#
#  왜 필요한가: 배당락일은 우리 창고에 없는 자료이고, 어느 창구에서
#  받아야 하는지도 확실하지 않습니다. 개발하는 쪽 컴퓨터에서는 DART
#  접속이 막혀 있어 문서조차 볼 수 없습니다. 깃허브 서버는 볼 수
#  있으니 여기서 대신 두드려 봅니다.
#
#  "아마 이 주소일 것이다" 하고 코드를 먼저 쓰면 404 를 받고 나서야
#  틀린 줄 압니다. 이 프로젝트에서 이미 한 번 그랬습니다.
# =============================================================

name: 배당 기준일 정찰

on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목코드 (기본 005930 삼성전자)"
        required: false
        default: "005930"
      year:
        description: "확인할 사업연도"
        required: false
        default: "2025"

jobs:
  probe:
    name: 정찰
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 부품(라이브러리) 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 정찰
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TZ: Asia/Seoul
        run: |
          CODE="${{ github.event.inputs.code }}"
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$CODE" ]; then CODE=005930; fi
          if [ -z "$YEAR" ]; then YEAR=2025; fi
          python -m src.dividend_probe --code "$CODE" --year "$YEAR"
